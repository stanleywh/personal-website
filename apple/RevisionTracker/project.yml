name: RevisionTracker
options:
  bundleIdPrefix: com.stanley
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: Revision Tracker
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  RevisionTracker-iOS:
    type: application
    platform: iOS
    sources: [App, Models, Services, Views]
    info:
      path: Support/Info-iOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stanley.revisiontracker
        PRODUCT_MODULE_NAME: RevisionTracker
        CODE_SIGN_ENTITLEMENTS: Support/RevisionTracker-iOS.entitlements
  RevisionTracker-macOS:
    type: application
    platform: macOS
    sources: [App, Models, Services, Views]
    info:
      path: Support/Info-macOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stanley.revisiontracker.macos
        PRODUCT_MODULE_NAME: RevisionTracker
        CODE_SIGN_ENTITLEMENTS: Support/RevisionTracker-macOS.entitlements
  RevisionTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: RevisionTracker-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stanley.revisiontracker.tests
        PRODUCT_MODULE_NAME: RevisionTrackerTests
