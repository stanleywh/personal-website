<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Stanley's personal website — open the revision tracker, finances, projects, and about pages."
  >
  <title>Stanley — Personal Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home">
  <div class="home__shell">
    <main class="home__main">
      <section class="home__hero reveal" style="--reveal-order: 0;" aria-labelledby="page-title">
        <h1 id="page-title">Stanley</h1>
      </section>

      <nav class="directory" aria-label="Explore the website">
        <a class="directory-card reveal" style="--reveal-order: 1;" href="tracker.html">
          <span class="directory-card__identity">
            <span class="directory-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="4.25" y="3.75" width="15.5" height="16.5" rx="2"></rect>
                <path d="m7.5 9 1.25 1.25L11 8M13.5 9.25h3M7.5 15l1.25 1.25L11 14m2.5 1.25h3"></path>
              </svg>
            </span>
            <span class="directory-card__title">Revision Tracker</span>
          </span>
          <span class="directory-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 12h14M14 7l5 5-5 5"></path>
            </svg>
          </span>
        </a>

        <a class="directory-card reveal" style="--reveal-order: 2;" href="finances.html">
          <span class="directory-card__identity">
            <span class="directory-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="3.75" y="5.25" width="16.5" height="13.5" rx="2"></rect>
                <path d="M3.75 8.75h13.5a3 3 0 0 1 3 3v3.5h-4.5a2.5 2.5 0 0 1 0-5h4.5M15.75 12.75h.01"></path>
              </svg>
            </span>
            <span class="directory-card__title">Finances</span>
          </span>
          <span class="directory-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 12h14M14 7l5 5-5 5"></path>
            </svg>
          </span>
        </a>

        <a class="directory-card reveal" style="--reveal-order: 3;" href="projects.html">
          <span class="directory-card__identity">
            <span class="directory-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M3.75 7.5h6l1.7 2h8.8v8.75a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5V7.5Z"></path>
                <path d="M3.75 7.5V5.75a1.5 1.5 0 0 1 1.5-1.5H9l1.75 2h8a1.5 1.5 0 0 1 1.5 1.5V9.5"></path>
              </svg>
            </span>
            <span class="directory-card__title">Projects</span>
          </span>
          <span class="directory-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 12h14M14 7l5 5-5 5"></path>
            </svg>
          </span>
        </a>

        <a class="directory-card reveal" style="--reveal-order: 4;" href="about.html">
          <span class="directory-card__identity">
            <span class="directory-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="12" cy="8" r="3.25"></circle>
                <path d="M5.75 19c.45-3.32 2.54-5.25 6.25-5.25S17.8 15.68 18.25 19"></path>
              </svg>
            </span>
            <span class="directory-card__title">About</span>
          </span>
          <span class="directory-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 12h14M14 7l5 5-5 5"></path>
            </svg>
          </span>
        </a>
      </nav>
    </main>

    <footer class="home__footer reveal" style="--reveal-order: 5;">
      <p>&copy; <span data-year>2026</span> Stanley</p>
    </footer>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
